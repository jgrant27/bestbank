# Rocket 0.5 configuration. Profiles are `debug` (used by `cargo run`) and
# `release` (used by `cargo run --release`); `default` applies to both.
# Any value can be overridden with ROCKET_<KEY> environment variables.

[default]
address = "0.0.0.0"
# SQLite database (created on first start; migrations run automatically).
# Override with ROCKET_DATABASE_URL, e.g. "sqlite::memory:" for a throwaway DB.
database_url = "sqlite://bestbank.db"
# Seed the demo admin/admin account when it doesn't exist.
seed_demo_admin = true

[debug]
port = 8080

[release]
port = 8443
# A `secret_key` is REQUIRED in release because sessions use encrypted
# private cookies. Don't commit one; supply it via the environment:
#   ROCKET_SECRET_KEY=$(openssl rand -base64 32) cargo run --release

# The certificate/private key pair used here was generated via openssl using the
# `gen_cert.sh` script located in the `private/` subdirectory.
#
# The certificate is self-signed. As such, you will need to trust it directly
# for your browser to refer to the connection as secure. You should NEVER use
# this certificate/key pair. It is here for DEMONSTRATION PURPOSES ONLY.
[release.tls]
certs = "private/cert.pem"
key = "private/key.pem"
