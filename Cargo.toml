[package]
name = "bestbank"
version = "0.6.0"
authors = ["jgrant"]
edition = "2024"

[dependencies]
maplit = "1"
md5 = "0.7"
chrono = "0.4"
serde = "1.0"
serde_json = "1.0"
serde_derive = "1.0"
mio = "1"

rocket = { version = "0.5.1", features = ["json", "secrets"] }
rocket_dyn_templates = { version = "0.2.0", features = ["handlebars", "tera"] }
rocket-include-static-resources = "0.10.5"
argon2 = "0.6"
rocket_ws = "0.1.1"

# Argon2 is intentionally expensive; optimise it even in debug/test builds so
# logins (and the test suite) stay fast.
[profile.dev.package.argon2]
opt-level = 3
